name: .NET

# 同一コミットでの重複実行を避けるため、push は常に、pull_request は他所のフォークからのものだけを対象とする。
# 全体のトリガーではこの条件を判定できないので、起点となるジョブ側で判定する。
on: [push, pull_request]

env:
  EXCLUDE_RUN_ID_FROM_PACKAGE: false
  EXCLUDE_SUFFIX_FROM_VERSION: false

jobs:

  # ソリューション全体を Release/x64 でビルドする。
  build-solution:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.user.login != github.repository_owner
    runs-on: windows-2022
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build
      run: dotnet build ComputeWeave.sln -c Release -p:Platform=x64

  # NuGet パッケージを生成し、成果物として保存する。
  build-packages:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.user.login != github.repository_owner
    runs-on: windows-2022
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Build ComputeWeave.Core package
      run: dotnet pack src\ComputeWeave.Core\ComputeWeave.Core.csproj -c Release
    - name: Build ComputeWeave package
      run: dotnet pack src\ComputeWeave\ComputeWeave.csproj -c Release
    - name: Build ComputeWeave.Dxc package
      run: dotnet pack src\ComputeWeave.Dxc\ComputeWeave.Dxc.csproj -c Release
    - name: Build ComputeWeave.D3D12MemoryAllocator package
      run: dotnet pack src\ComputeWeave.D3D12MemoryAllocator\ComputeWeave.D3D12MemoryAllocator.csproj -c Release
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget_packages
        path: artifacts\*.nupkg
        if-no-files-found: error

  # 全テストを実行する。
  run-tests:
    needs: [build-solution]
    runs-on: windows-2022

    # ComputeWeave.Dxc が参照する環境変数。
    # https://github.com/actions/runner-images/issues/6531 への対処。
    env:
      CI_RUNNER_DOTNET_TEST_PLATFORM: x64
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Run ComputeWeave.Tests
      run: dotnet test tests\ComputeWeave.Tests\ComputeWeave.Tests.csproj -c Release -p:Platform=x64
    - name: Run ComputeWeave.Tests.Internals
      run: dotnet test tests\ComputeWeave.Tests.Internals\ComputeWeave.Tests.Internals.csproj -c Release -p:Platform=x64
    - name: Run ComputeWeave.Tests.SourceGenerators
      run: dotnet test tests\ComputeWeave.Tests.SourceGenerators\ComputeWeave.Tests.SourceGenerators.csproj -c Release -p:Platform=x64

  # ビルドした NuGet パッケージを GitHub Release として公開する。
  # GitHub Packages や Azure DevOps への push はフォークでは認証できず失敗するため、
  # 代わりに自動生成のリリースノートを付けたリリースを作成し、.nupkg を資産として添付する。
  publish-release:
    needs: [run-tests, build-packages]
    runs-on: windows-2022
    if: ${{github.event_name == 'push'}}
    permissions:
      contents: write
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget_packages
        path: artifacts
    - name: Create GitHub release with NuGet packages
      shell: bash
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: |
        gh release create "build-${{github.sha}}" artifacts/*.nupkg \
          --target "${{github.sha}}" \
          --title "Nightly build ${{github.sha}}" \
          --generate-notes \
          --prerelease
